# ══════════════════════════════════════
# NOM DE L'APPLICATION
# ══════════════════════════════════════
spring.application.name=serviprox-backend

# ══════════════════════════════════════
# BASE DE DONNÉES
# ${VARIABLE:valeur_defaut}
# → En local : utilise valeur_defaut
# → Dans Docker : utilise la variable
#   définie dans docker-compose.yml
# ══════════════════════════════════════

# URL de connexion PostgreSQL
# En local  : jdbc:postgresql://localhost:5432/serviprox_db
# En Docker : jdbc:postgresql://postgres:5432/serviprox_db
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/serviprox_db}

# Utilisateur PostgreSQL
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:serviprox_user}

# Mot de passe PostgreSQL
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:serviprox2026}

# Driver JDBC PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# ══════════════════════════════════════
# JPA / HIBERNATE
# ══════════════════════════════════════

# Stratégie de création des tables
# update = créer si absente, modifier si besoin
# create = recréer à chaque démarrage (dev seulement)
# none   = ne rien faire (production)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# Afficher les requêtes SQL dans les logs
# true  = visible → utile pour déboguer
# false = caché → recommandé en production
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}

# Dialecte SQL adapté à PostgreSQL
# Hibernate génère le SQL compatible PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Formater le SQL pour une meilleure lisibilité
# Indente les requêtes dans les logs
spring.jpa.properties.hibernate.format_sql=true

# ══════════════════════════════════════
# JWT — JSON Web Token
# ══════════════════════════════════════

# Clé secrète pour signer les tokens JWT
# IMPORTANT : changer en production !
# Minimum 32 caractères pour HS256
jwt.secret=${JWT_SECRET:serviprox-secret-key-2026-uasz-senegal-m2}

# Durée de validité du token en millisecondes
# 86400000 ms = 24 heures
# Après 24h → l'utilisateur doit se reconnecter
jwt.expiration=${JWT_EXPIRATION:86400000}

# ══════════════════════════════════════
# SERVEUR
# ══════════════════════════════════════

# Port d'écoute de Spring Boot
# Flutter et React appellent http://localhost:7090
server.port=${SERVER_PORT:7090}logging.level.org.springframework.security=DEBUG
